
name: Build and Push Docker to GHCR

on:
  push:
    branches:
      - main
    paths:
      - 'auth/**'
      - 'cards/**'
      - 'server/**'
      - '.github/workflows/build-push-ecr.yml'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          REPO_OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_NAME=ghcr.io/$REPO_OWNER_LC/speedcardgame-auth:latest
          docker build -t $IMAGE_NAME auth
          echo "IMAGE_NAME=$IMAGE_NAME" >> $GITHUB_ENV

      - name: Push Docker image to GHCR
        run: |
          docker push $IMAGE_NAME
