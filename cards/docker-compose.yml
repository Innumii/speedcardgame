services:
  app:
    build:
      context: .  # Build from the current directory (root)
      dockerfile: Dockerfile  # Uses Dockerfile located in root
    depends_on:
      - db  # Ensures the DB service starts before the app
    environment:
      - PORT=${PORT}  # Uses the value from the .env file
      - DATABASE_URL=${DATABASE_URL}  # Uses the value from the .env file
    ports:
      - "${APP_PORT}:${PORT}"  # Expose the app on the host using the .env values
    networks:
      - mynetwork

  db:
    image: postgres:16  # Use the official PostgreSQL image
    environment:
      POSTGRES_USER: ${POSTGRES_USER}  # Read from the .env file
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}  # Read from the .env file
      POSTGRES_DB: ${POSTGRES_DB}  # Read from the .env file
    ports:
      - "${DB_PORT}:5432"  # Expose the database on the host using the .env value
    volumes:
      - postgres_data:/var/lib/postgresql/data  # Persist database data
    networks:
      - mynetwork

networks:
  mynetwork:  # Define a shared network for the app and DB

volumes:
  postgres_data:  # Define volume for persisting PostgreSQL data
