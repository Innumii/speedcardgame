name: client-lint
on:
  push:
    paths:
      - 'client/**'
  pull_request:
    paths:
      - 'client/**'

permissions:
  contents: read

jobs:
  cppcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck

      - name: Run cppcheck on client
        run: |
          cppcheck \
            --std=c++17 \
            --language=c++ \
            --enable=warning,portability \
            --error-exitcode=1 \
            --inline-suppr \
            --force \
            --suppress=preprocessorErrorDirective \
            --suppress=missingIncludeSystem \
            --template=gcc \
            -I client/include \
            -i client/include/httplib \
            client/src

      - name: Run advisory cppcheck style scan
        run: |
          cppcheck \
            --std=c++17 \
            --language=c++ \
            --enable=style,performance \
            --inline-suppr \
            --suppress=missingIncludeSystem \
            --template=gcc \
            -I client/include \
            client/src client/include || true
