name: client-release

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'client/**'
      - '.github/workflows/client-release.yml'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2 (MinGW)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            make
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-SDL2_ttf
            mingw-w64-x86_64-SDL2_image
            mingw-w64-x86_64-openssl

      - name: Set USE_AWS_SERVICES to true in .env
        shell: msys2 {0}
        run: |
          cd client/env
          if [ ! -f .env ] && [ -f .env.template ]; then
            cp .env.template .env
          fi

          if [ ! -f .env ]; then
            echo 'USE_AWS_SERVICES=true' > .env
          elif grep -q '^USE_AWS_SERVICES=' .env; then
            sed -i 's/^USE_AWS_SERVICES=.*/USE_AWS_SERVICES=true/' .env
          else
            echo 'USE_AWS_SERVICES=true' >> .env
          fi

      - name: Build client
        shell: msys2 {0}
        run: |
          cd client
          make

      - name: Bundle runtime dependencies
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cd client

          mkdir -p dist dist/env dist/certs
          cp main.exe dist/main.exe

          # Copy .env and CA cert into bundle
          if [ -f env/.env ]; then
            cp env/.env dist/env/.env
          elif [ -f env/.env.template ]; then
            cp env/.env.template dist/env/.env
          fi

          if [ -f certs/ca.crt ]; then
            cp certs/ca.crt dist/certs/ca.crt
          fi

          if [ -d assets ]; then
            cp -r assets dist/assets
          fi

          ldd main.exe \
            | awk '/=> \/mingw64\/bin\// { print $3 }' \
            | sort -u \
            | while read -r dllpath; do
                if [ -f "$dllpath" ]; then
                  cp "$dllpath" dist/
                fi
              done

      - name: Package build artifact
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path 'client/dist/main.exe')) {
            throw 'Bundled executable not found at client/dist/main.exe.'
          }

          Compress-Archive -Path client/dist/* -DestinationPath client/client-latest-windows.zip -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: client-windows
          path: client/client-latest-windows.zip

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install sdl2 sdl2_ttf sdl2_image openssl@3 pkg-config

      - name: Set USE_AWS_SERVICES to true in .env
        run: |
          cd client/env
          if [ ! -f .env ] && [ -f .env.template ]; then
            cp .env.template .env
          fi

          if [ ! -f .env ]; then
            echo 'USE_AWS_SERVICES=true' > .env
          elif grep -q '^USE_AWS_SERVICES=' .env; then
            sed -i '' 's/^USE_AWS_SERVICES=.*/USE_AWS_SERVICES=true/' .env
          else
            echo 'USE_AWS_SERVICES=true' >> .env
          fi

      - name: Build client
        run: |
          cd client
          make -f Makefile.mac clean
          make -f Makefile.mac

      - name: Bundle artifact
        run: |
          set -euo pipefail
          cd client

          mkdir -p dist dist/env dist/certs
          cp main dist/main
          chmod +x dist/main

          # Copy .env and CA cert into bundle
          if [ -f env/.env ]; then
            cp env/.env dist/env/.env
          elif [ -f env/.env.template ]; then
            cp env/.env.template dist/env/.env
          fi

          if [ -f certs/ca.crt ]; then
            cp certs/ca.crt dist/certs/ca.crt
          fi

          if [ -d assets ]; then
            cp -r assets dist/assets
          fi

          # Copy all Homebrew dylibs that main links against
          otool -L main \
            | awk '/\/opt\/homebrew\/|\/usr\/local\// { print $1 }' \
            | while read -r lib; do
                [ -f "$lib" ] && cp "$lib" dist/
              done

          # Fix install names so bundled dylibs are found at runtime
          for lib in dist/*.dylib; do
            [ -f "$lib" ] || continue
            orig=$(otool -D "$lib" | tail -1)
            install_name_tool -change "$orig" \
              "@executable_path/$(basename "$lib")" dist/main 2>/dev/null || true
          done

          zip -r client-latest-macos.zip dist/

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: client-macos
          path: client/client-latest-macos.zip

  publish:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: client-windows
          path: release/

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: client-macos
          path: release/

      - name: Publish latest client release
        uses: ncipollo/release-action@v1
        with:
          tag: client-latest
          name: Client Latest Build
          body: Automated latest client build from GitHub Actions.
          allowUpdates: true
          removeArtifacts: true
          artifactErrorsFailBuild: true
          artifacts: release/client-latest-windows.zip,release/client-latest-macos.zip
          makeLatest: true