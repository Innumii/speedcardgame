services:
  auth:
    build: ./auth
    env_file:
      - ./.env
    ports:
      - "${DOCKER_AUTH_SERVICE_PORT:-8081}:8080"
    restart: unless-stopped
    volumes:
      - ./auth/certs:/app/certs:ro
    environment:
      POSTGRES_HOST: auth-db
      POSTGRES_USER: ${AUTH_POSTGRES_USER}
      POSTGRES_PASSWORD: ${AUTH_POSTGRES_PASSWORD}
      POSTGRES_DB: ${AUTH_POSTGRES_DB}
      POSTGRES_PORT: ${AUTH_POSTGRES_PORT}
      POSTGRES_SSLMODE: ${AUTH_POSTGRES_SSLMODE}
      POSTGRES_TIMEZONE: ${AUTH_POSTGRES_TIMEZONE}
      REDIS_HOST: auth-redis
      REDIS_PORT: ${AUTH_REDIS_PORT}
      CARDS_SERVICE_HOST: cards
      TLS_VERIFY_CERTS: "${TLS_VERIFY_CERTS:-false}"
      CARDS_CA_CERT_PATH: ${CARDS_CA_CERT_PATH:-/app/certs/ca.crt}
      DEBUG_LOG_ENABLED: ${DEBUG_LOG_ENABLED:-false}
      HTTP_REQUEST_LOG_ENABLED: ${HTTP_REQUEST_LOG_ENABLED:-true}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
    depends_on:
      auth-db:
        condition: service_healthy
      auth-redis:
        condition: service_healthy
      cards:
        condition: service_started

  auth-db:
    image: postgres:16
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      POSTGRES_USER: ${AUTH_POSTGRES_USER}
      POSTGRES_PASSWORD: ${AUTH_POSTGRES_PASSWORD}
      POSTGRES_DB: ${AUTH_POSTGRES_DB}
    ports:
      - "${AUTH_DB_PORT:-5432}:5432"
    volumes:
      - auth-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTH_POSTGRES_USER} -d ${AUTH_POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  auth-redis:
    image: redis:7
    restart: unless-stopped
    env_file:
      - ./.env
    ports:
      - "${AUTH_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  cards:
    build:
      context: ./cards
      dockerfile: Dockerfile
    volumes:
      - ./cards/assets/cards:/app/assets/cards:ro
      - ./cards/certs:/app/certs:ro
    env_file:
      - ./.env
    depends_on:
      cards-db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: cards-db
      POSTGRES_USER: ${CARDS_POSTGRES_USER}
      POSTGRES_PASSWORD: ${CARDS_POSTGRES_PASSWORD}
      POSTGRES_DB: ${CARDS_POSTGRES_DB}
      POSTGRES_PORT: 5432
      POSTGRES_SSLMODE: disable
      POSTGRES_TIMEZONE: UTC
      REDIS_HOST: auth-redis
      REDIS_PORT: ${AUTH_REDIS_PORT}
      DEBUG_LOG_ENABLED: ${DEBUG_LOG_ENABLED:-false}
      HTTP_REQUEST_LOG_ENABLED: ${HTTP_REQUEST_LOG_ENABLED:-true}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      ALLOW_DIRECT_CARD_PAYMENTS: ${ALLOW_DIRECT_CARD_PAYMENTS:-false}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
    ports:
      - "${DOCKER_CARDS_SERVICE_PORT:-8082}:${DOCKER_CARDS_SERVICE_PORT:-8082}"

  cards-db:
    image: postgres:16
    env_file:
      - ./.env
    environment:
      POSTGRES_USER: ${CARDS_POSTGRES_USER}
      POSTGRES_PASSWORD: ${CARDS_POSTGRES_PASSWORD}
      POSTGRES_DB: ${CARDS_POSTGRES_DB}
    ports:
      - "${CARDS_DB_PORT:-5433}:5432"
    volumes:
      - cards-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CARDS_POSTGRES_USER} -d ${CARDS_POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
  game-server:
    build: ./server
    env_file:
      - ./.env
    ports:
      - "4000:4000"
    restart: unless-stopped
    depends_on:
      cards:
        condition: service_started
    sysctls:
      - net.core.somaxconn=65535
    volumes:
      - ./server/certs:/certs:ro

volumes:
  auth-postgres:
  cards-postgres:
