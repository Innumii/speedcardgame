name: golangci-lint
on:
  push:
    paths:
      - 'auth/**'
      - 'cards/**'
  pull_request:
    paths:
      - 'auth/**'
      - 'cards/**'

permissions:
  contents: read
  pull-requests: read

jobs:
  golangci-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [auth, cards]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache: false
      - name: golangci-lint (${{ matrix.module }})
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: ${{ matrix.module }}
          args: --timeout=5m
