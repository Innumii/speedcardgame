name: Build and Push Docker to GHCR

on:
  push:
    branches:
      - main
      - https
    paths:
      - 'auth/**'
      - 'cards/**'
      - 'server/**'
      - '.github/workflows/service-release.yml'

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write

    strategy:
      matrix:
        service: [auth, cards, server]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve branch tag
        id: branch_tag
        run: |
          BRANCH="${{ github.ref_name }}"
          if [[ "$BRANCH" == "main" ]]; then
            echo "tag=latest" >> $GITHUB_OUTPUT
          else
            echo "tag=$BRANCH" >> $GITHUB_OUTPUT
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push ${{ matrix.service }} Service
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE=ghcr.io/$OWNER/g4t2-${{ matrix.service }}-service
          TAG=${{ steps.branch_tag.outputs.tag }}

          docker build -f ${{ matrix.service }}/Dockerfile \
            -t $IMAGE:$TAG \
            ${{ matrix.service }}/

          docker push $IMAGE:$TAG

      - name: Clean up old GHCR images (keep only latest + https)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          PACKAGE="g4t2-${{ matrix.service }}-service"

          echo "Cleaning package: $PACKAGE"

          VERSIONS=$(gh api \
            /users/$OWNER/packages/container/$PACKAGE/versions \
            --jq '.[].id')

          for VERSION_ID in $VERSIONS; do
            TAGS=$(gh api \
              /users/$OWNER/packages/container/$PACKAGE/versions/$VERSION_ID \
              --jq '.metadata.container.tags[]')

            KEEP=false

            for TAG in $TAGS; do
              if [[ "$TAG" == "latest" || "$TAG" == "https" ]]; then
                KEEP=true
              fi
            done

            if [ "$KEEP" = false ]; then
              echo "Deleting version $VERSION_ID (tags: $TAGS)"
              gh api \
                --method DELETE \
                /users/$OWNER/packages/container/$PACKAGE/versions/$VERSION_ID
            else
              echo "Keeping version $VERSION_ID (tags: $TAGS)"
            fi
          done