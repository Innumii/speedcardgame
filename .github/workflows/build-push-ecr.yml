name: Build and Push to ECR

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    strategy:
      matrix:
        service: [auth, cards, server]

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::<ACCOUNT_ID>:role/github-deploy-role
          aws-region: ap-southeast-1

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push
        run: |
          IMAGE=${{ steps.login-ecr.outputs.registry }}/g4t2-${{ matrix.service }}:${{ github.sha }}
          docker build -f ${{ matrix.service }}/Dockerfile \
            -t $IMAGE \
            ${{ matrix.service }}/
          docker push $IMAGE
