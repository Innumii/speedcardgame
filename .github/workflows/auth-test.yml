name: Auth Tests

on:
  push:
    paths:
      - 'auth/**'
  pull_request:
    paths:
      - 'auth/**'

jobs:
  test:
    name: Unit Tests & Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'auth/go.mod'
          cache-dependency-path: 'auth/go.sum'

      - name: Install dependencies
        working-directory: auth
        run: go mod download

      - name: Run unit tests with coverage
        working-directory: auth
        run: |
          go test ./services/... \
            -v \
            -coverprofile=coverage.out \
            -covermode=atomic \
            -race
        env:
          CARDS_SERVICE_BASE_URL: ""   # overridden per-test via t.Setenv

      - name: Print coverage summary
        working-directory: auth
        run: go tool cover -func=coverage.out

      - name: Generate HTML coverage report
        working-directory: auth
        run: go tool cover -html=coverage.out -o coverage.html

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: auth-coverage-report
          path: auth/coverage.html
          retention-days: 14

      - name: Enforce minimum coverage (80%)
        working-directory: auth
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | tr -d '%')
          echo "Total coverage: ${COVERAGE}%"
          if (( $(echo "$COVERAGE < 80" | bc -l) )); then
            echo "Coverage ${COVERAGE}% is below the 80% threshold"
            exit 1
          fi
