name: Prune Actions Caches

on:
  push:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: prune-actions-caches-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Keep only latest 5 caches for this ref
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const ref = context.ref;
            const keep = 5;

            const caches = [];
            let page = 1;

            while (true) {
              const response = await github.request('GET /repos/{owner}/{repo}/actions/caches', {
                owner,
                repo,
                ref,
                per_page: 100,
                page,
              });

              const pageCaches = response.data.actions_caches || [];
              caches.push(...pageCaches);

              if (pageCaches.length < 100) {
                break;
              }

              page += 1;
            }

            caches.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

            if (caches.length <= keep) {
              core.info(`Found ${caches.length} cache entries for ${ref}; nothing to delete.`);
              return;
            }

            const toDelete = caches.slice(keep);
            core.info(`Found ${caches.length} cache entries for ${ref}; deleting ${toDelete.length} and keeping ${keep}.`);

            for (const cache of toDelete) {
              await github.request('DELETE /repos/{owner}/{repo}/actions/caches/{cache_id}', {
                owner,
                repo,
                cache_id: cache.id,
              });

              core.info(`Deleted cache id=${cache.id} key=${cache.key}`);
            }
